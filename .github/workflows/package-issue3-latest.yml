name: Package Issue 3 Latest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-issue3-latest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Issue 3 package
        run: |
          set -euo pipefail
          mkdir -p package/Issue_3_Beyond_Reincarnation/pages
          cp issue3.html package/Issue_3_Beyond_Reincarnation/
          cp assets/issue3/cover.webp package/Issue_3_Beyond_Reincarnation/cover.webp
          cp assets/issue3/9f24fbdd-0c31-48bb-bddc-e0fd7d291cf4.png package/Issue_3_Beyond_Reincarnation/cover-original.png
          cp assets/issue3/IMAM_Beyond_Reincarnation_Issue_3.pdf package/Issue_3_Beyond_Reincarnation/IMAM_Beyond_Reincarnation_Issue_3.pdf
          for i in $(seq -w 1 60); do cp "assets/issue3/page-${i}.webp" "package/Issue_3_Beyond_Reincarnation/pages/page-${i}.webp"; done
          printf '%s\n' 'ÏMAM — Issue Three: Beyond Reincarnation' 'Latest website package' '' 'Contents:' '- issue3.html: current Issue 3 reader page' '- cover.webp: current website cover asset' '- cover-original.png: original full-resolution cover artwork' '- pages/: all 60 current comic page images' '- IMAM_Beyond_Reincarnation_Issue_3.pdf: latest 61-page PDF edition (cover + 60 pages)' > package/Issue_3_Beyond_Reincarnation/README.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: IMAM-Issue-3-Latest-Package
          path: package/Issue_3_Beyond_Reincarnation
          retention-days: 1
          compression-level: 6
