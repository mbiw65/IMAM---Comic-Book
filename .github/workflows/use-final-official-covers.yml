name: Use final official covers

on:
  push:
    paths:
      - '.github/workflows/use-final-official-covers.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point chapter cards to final covers
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'assets/issue1/page-01.webp': 'assets/issue1/cover-final.webp?v=28',
              'assets/issue2/cover-saga.webp?v=27': 'assets/issue2/cover-final.webp?v=28',
              'assets/issue3/cover-saga.webp?v=27': 'assets/issue3/cover-final.webp?v=28',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected source: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/use-final-official-covers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/use-final-official-covers.yml
          git commit -m 'Use final official chapter covers'
          git push
