name: Publish corrected comic chapters
on:
  workflow_dispatch:
  push:
    paths:
      - '.chapter_uploads/issue1.zip'
      - '.chapter_uploads/issue2.zip'
      - '.chapter_uploads/issue3.zip'
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow img2pdf
      - run: python tools/publish_corrected_chapters.py
      - name: Commit corrected chapters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html issue1.html issue2.html issue3.html assets/issue1 assets/issue2 assets/issue3
          git rm -f .chapter_uploads/issue1.zip .chapter_uploads/issue2.zip .chapter_uploads/issue3.zip
          git commit -m "Publish corrected chapters I, II and III"
          git push
