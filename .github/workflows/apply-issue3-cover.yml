name: Apply Issue 3 Cover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-issue3-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified Issue 3 cover
        run: |
          set -euo pipefail
          git fetch origin temp-cover-upload-2
          : > /tmp/cover.b64
          for n in 00 01 02 03 04 05; do
            git show origin/temp-cover-upload-2:.cover-upload/part${n}.txt >> /tmp/cover.b64
          done
          base64 -d /tmp/cover.b64 > assets/issue3/cover.webp
          test "$(stat -c%s assets/issue3/cover.webp)" = "29172"
          test "$(sha256sum assets/issue3/cover.webp | awk '{print $1}')" = "760aaad3bef42b509f403880ebc70cd5c88d361821aadeb294eccc1b93ee2b37"

      - name: Point Issue Three card at dedicated cover
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<img src="assets/issue3/page-01.webp" alt="ÏMAM Issue Three cover" loading="lazy">'
          new='<img src="assets/issue3/cover.webp?v=2" alt="ÏMAM Issue Three — Beyond Reincarnation cover" loading="lazy">'
          if old not in s and new not in s:
              raise SystemExit('Issue Three cover image tag was not found.')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit final cover fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/issue3/cover.webp index.html
          git rm .github/workflows/apply-issue3-cover.yml
          git commit -m "Fix Issue 3 cover artwork"
          git push
