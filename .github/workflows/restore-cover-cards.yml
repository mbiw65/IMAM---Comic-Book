name: Restore working chapter cover cards
on:
  push:
    paths:
      - '.github/workflows/restore-cover-cards.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore valid cover images
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('assets/issue1/cover-final.webp?v=28','assets/issue1/page-01.webp?v=29')
          s=s.replace('assets/issue2/cover-final.webp?v=28','assets/issue2/cover-saga.webp?v=29')
          s=s.replace('assets/issue3/cover-final.webp?v=28','assets/issue3/cover-saga.webp?v=29')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/restore-cover-cards.yml
          git commit -m 'Restore working chapter cover cards'
          git push
