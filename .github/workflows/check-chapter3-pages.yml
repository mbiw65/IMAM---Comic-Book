name: Check Chapter III completeness
on:
  push:
    paths:
      - '.github/workflows/check-chapter3-pages.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy imagehash
      - name: Compare original 60 images against corrected 57
        run: |
          mkdir -p /tmp/old-issue3
          git ls-tree -r --name-only ce18d7ff8133a0f7a341d1b991b47c0567a6aa92 assets/issue3 | grep -E 'page-[0-9]+[.]webp$' | while read -r file; do git show "ce18d7ff8133a0f7a341d1b991b47c0567a6aa92:$file" > "/tmp/old-issue3/${file##*/}"; done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageFilter,ImageChops,ImageStat
          import imagehash,numpy as np
          old=sorted(Path('/tmp/old-issue3').glob('page-*.webp'))
          new=sorted(Path('assets/issue3').glob('page-*.webp'))
          def features(f):
              with Image.open(f) as img:
                  rgb=ImageOps.exif_transpose(img).convert('RGB')
                  gray=rgb.convert('L')
                  return (imagehash.phash(gray),imagehash.dhash(gray),
                      np.asarray(rgb.resize((80,112),Image.Resampling.LANCZOS),dtype=np.float32),
                      rgb.size)
          a=[features(f) for f in old];b=[features(f) for f in new]
          match=[]
          for i,af in enumerate(a):
              scores=[]
              for j,bf in enumerate(b):
                  ph=af[0]-bf[0];dh=af[1]-bf[1]
                  # Structural correlation between rescaled versions, tolerant of modest color/compression changes
                  ar=af[2].reshape(-1);br=bf[2].reshape(-1)
                  cor=float(np.corrcoef(ar,br)[0,1])
                  mse=float(np.mean((ar-br)**2))
                  score=ph+dh*.5+(1-cor)*20
                  scores.append((round(score,2),j,ph,dh,round(cor,3),int(mse)))
              scores.sort()
              x=scores[0];y=scores[1]
              match.append((i+1,x[1]+1,*[x[0],x[2],x[3],x[4],x[5]],y[1]+1,y[0]))
          print('OLD:',len(old),'NEW:',len(new))
          print('old_page best_new_page match_score phash_distance dhash_distance pixel_correlation mean_square_error second_best_new second_score')
          for m in match:print(*m)
          strict=[m for m in match if m[3]<=8 and m[4]<=10 and m[5]>.84]
          loose=[m for m in match if m[3]<=14 and m[4]<=16 and m[5]>.65]
          print('STRICT_MATCHES:',[(m[0],m[1]) for m in strict])
          print('LOOSE_MATCHES:',[(m[0],m[1]) for m in loose])
          print('OLD_UNMATCHED:',[m[0] for m in match if m not in loose])
          print('NEW_NOT_MATCHED:',[k for k in range(1,len(new)+1) if k not in [m[1] for m in loose]])
          PY
