name: Import Issue 3 assets

on:
  push:
    paths:
      - issue3-pages.zip

permissions:
  contents: write

jobs:
  import-issue-3:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tools
        run: python -m pip install --disable-pip-version-check pillow reportlab

      - name: Import Issue 3 pages and build web PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil, zipfile
          from PIL import Image
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4

          archive = Path('issue3-pages.zip')
          if not archive.exists():
              raise SystemExit('issue3-pages.zip was not found.')

          temp = Path('.issue3-import')
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir()
          with zipfile.ZipFile(archive) as z:
              z.extractall(temp)

          source_pages = []
          pattern = re.compile(r'issue-3-page-(\d+)\.webp$', re.I)
          for p in temp.rglob('*.webp'):
              m = pattern.search(p.name)
              if m:
                  source_pages.append((int(m.group(1)), p))
          source_pages.sort()

          numbers = [n for n, _ in source_pages]
          expected = list(range(1, 61))
          if numbers != expected:
              raise SystemExit(f'Expected pages 1-60, found: {numbers}')

          dest = Path('assets/issue3')
          dest.mkdir(parents=True, exist_ok=True)
          for old in dest.glob('page-*.webp'):
              old.unlink()

          for n, src in source_pages:
              shutil.copy2(src, dest / f'page-{n:02d}.webp')

          # Build a GitHub-friendly PDF from the web pages. The uploaded source
          # PDF is much larger than GitHub's single-file limit, so this version
          # keeps the artwork readable while staying web-friendly.
          pdf_path = dest / 'IMAM_Beyond_Reincarnation_Issue_3.pdf'
          jpg_dir = temp / 'jpg'
          jpg_dir.mkdir()
          jpgs = []
          for n, src in source_pages:
              im = Image.open(src).convert('RGB')
              # Keep the original page dimensions; JPEG compression keeps the
              # final PDF comfortably below GitHub's 100 MB file limit.
              jp = jpg_dir / f'page-{n:02d}.jpg'
              im.save(jp, 'JPEG', quality=80, optimize=True, progressive=True)
              jpgs.append(jp)

          page_w, page_h = A4
          c = canvas.Canvas(str(pdf_path), pagesize=A4, pageCompression=1)
          for jp in jpgs:
              with Image.open(jp) as im:
                  iw, ih = im.size
              scale = min(page_w / iw, page_h / ih)
              dw, dh = iw * scale, ih * scale
              c.drawImage(str(jp), (page_w-dw)/2, (page_h-dh)/2, dw, dh,
                          preserveAspectRatio=True, mask='auto')
              c.showPage()
          c.save()

          size_mb = pdf_path.stat().st_size / 1024 / 1024
          if size_mb >= 95:
              raise SystemExit(f'Generated PDF is unexpectedly large: {size_mb:.1f} MB')
          print(f'Imported 60 pages. PDF size: {size_mb:.1f} MB')
          PY

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/issue3
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
          else
            git commit -m "Import Issue 3 comic assets"
            git push
          fi
