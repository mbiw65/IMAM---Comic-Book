name: Integrate Issue 3

on:
  push:
    branches: [main]
    paths:
      - 'assets/IMAM_Beyond_Reincarnation_Issue_3_WebP_Pages/**'
      - '.github/workflows/import-issue3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-issue-3:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tools
        run: python -m pip install --disable-pip-version-check pillow reportlab

      - name: Build Issue 3 and wire the website
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil, textwrap
          from PIL import Image
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4

          source = Path('assets/IMAM_Beyond_Reincarnation_Issue_3_WebP_Pages')
          if not source.exists():
              raise SystemExit('Issue 3 source folder was not found.')

          pages = []
          pattern = re.compile(r'issue-3-page-(\d+)\.webp$', re.I)
          for p in source.glob('*.webp'):
              m = pattern.fullmatch(p.name)
              if m:
                  pages.append((int(m.group(1)), p))
          pages.sort()
          numbers = [n for n, _ in pages]
          if numbers != list(range(1, 61)):
              raise SystemExit(f'Expected Issue 3 pages 1-60, found: {numbers}')

          dest = Path('assets/issue3')
          dest.mkdir(parents=True, exist_ok=True)
          for old in dest.glob('page-*.webp'):
              old.unlink()
          for n, src in pages:
              shutil.copy2(src, dest / f'page-{n:02d}.webp')

          # Build a compact downloadable PDF from the uploaded web pages.
          pdf_path = dest / 'IMAM_Beyond_Reincarnation_Issue_3.pdf'
          jpg_dir = Path('.issue3-jpg')
          if jpg_dir.exists():
              shutil.rmtree(jpg_dir)
          jpg_dir.mkdir()
          jpgs = []
          for n, src in pages:
              with Image.open(src) as im:
                  im = im.convert('RGB')
                  jp = jpg_dir / f'page-{n:02d}.jpg'
                  im.save(jp, 'JPEG', quality=80, optimize=True, progressive=True)
                  jpgs.append(jp)

          page_w, page_h = A4
          c = canvas.Canvas(str(pdf_path), pagesize=A4, pageCompression=1)
          for jp in jpgs:
              with Image.open(jp) as im:
                  iw, ih = im.size
              scale = min(page_w / iw, page_h / ih)
              dw, dh = iw * scale, ih * scale
              c.drawImage(str(jp), (page_w-dw)/2, (page_h-dh)/2, dw, dh,
                          preserveAspectRatio=True, mask='auto')
              c.showPage()
          c.save()
          shutil.rmtree(jpg_dir)
          size_mb = pdf_path.stat().st_size / 1024 / 1024
          if size_mb >= 95:
              raise SystemExit(f'Generated PDF is too large: {size_mb:.1f} MB')

          issue3_html = textwrap.dedent('''\
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>ÏMAM — Beyond Reincarnation</title>
            <link rel="icon" href="/assets/site/favicon.svg">
            <link rel="stylesheet" href="/styles.css?v=20">
            <link rel="stylesheet" href="/reader-effects.css?v=2">
            <link rel="stylesheet" href="/reader-no-dots.css?v=1">
          </head>
          <body class="reader-body" data-pages="60">
            <div class="progress" id="progress"></div>
            <header class="reader-bar">
              <div class="left">
                <a class="icon-btn" id="homeLink" href="/">← Home</a>
                <div class="reader-title">Beyond Reincarnation<small>ÏMAM · Issue Three</small></div>
              </div>
              <div class="right">
                <button class="icon-btn hide-mobile" id="prevPage">←</button>
                <span class="page-counter" id="pageCounter">1 / 60</span>
                <button class="icon-btn hide-mobile" id="nextPage">→</button>
                <button class="icon-btn" id="fullscreen">⛶</button>
              </div>
            </header>
            <main class="reader-wrap" id="reader"></main>
            <script>
              (() => {
                const params=new URLSearchParams(location.search),requested=params.get('side'),saved=localStorage.getItem('imamverse_side');
                const side=(requested==='mbiw'||requested==='imam')?requested:((saved==='mbiw'||saved==='imam')?saved:'imam');
                document.documentElement.dataset.side=side;document.body.dataset.side=side;
                const reader=document.getElementById('reader');
                for(let i=1;i<=60;i++){
                  const n=String(i).padStart(2,'0'),fig=document.createElement('figure'),img=document.createElement('img');
                  fig.className='comic-page';fig.id=`page-${i}`;fig.dataset.page=i;fig.dataset.label=`Page ${i}`;
                  img.src=`/assets/issue3/page-${n}.webp`;img.alt=`ÏMAM Issue Three — Page ${i}`;img.loading=i<=2?'eager':'lazy';img.decoding='async';
                  fig.appendChild(img);reader.appendChild(fig);
                }
                reader.insertAdjacentHTML('beforeend',`<section class="reader-end"><div class="eyebrow">End of Issue Three</div><h2>The Peace Was Only the Beginning.</h2><p>ÏMAM — Beyond Reincarnation.</p><div class="hero-actions"><a class="button primary" id="backHome" href="/">Back Home</a><a class="button" href="/assets/issue3/IMAM_Beyond_Reincarnation_Issue_3.pdf" download>Download PDF</a></div></section>`);
                const closeFromFrame=(event)=>{if(window.top!==window.self){event.preventDefault();window.parent.postMessage({type:'imamverse-close-reader'},window.location.origin);}};
                const home=document.getElementById('homeLink');if(home)home.addEventListener('click',closeFromFrame);
                const back=document.getElementById('backHome');if(back)back.addEventListener('click',closeFromFrame);
              })();
            </script>
            <script src="/reader-history.js?v=1"></script>
            <script src="/reader.js?v=12"></script>
          </body>
          </html>
          ''')
          Path('issue3.html').write_text(issue3_html, encoding='utf-8')

          # Issue Two now continues directly into Issue Three.
          p2 = Path('issue2.html')
          t2 = p2.read_text(encoding='utf-8')
          new_end = '''reader.insertAdjacentHTML('beforeend',`<section class="reader-end"><div class="eyebrow">End of Issue Two</div><h2>Beyond Reincarnation.</h2><p>Continue directly into Issue Three.</p><div class="hero-actions"><a class="button primary" id="nextIssue" href="/issue3/">Read Issue Three</a><a class="button" href="/assets/issue2/IMAM_Issue_Two.pdf" download>Download PDF</a><a class="button" id="backHome" href="/">Back Home</a></div></section>`);'''
          t2, count = re.subn(r'''reader\.insertAdjacentHTML\('beforeend',`<section class="reader-end">.*?</section>`\);''', new_end, t2, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not update Issue Two ending.')
          t2 = re.sub(
              r'''if\(next\)\{next\.href='[^']*';if\(window\.top!==window\.self\)next\.addEventListener\('click',event=>\{event\.preventDefault\(\);window\.parent\.postMessage\(\{type:'imamverse-open-reader',issue:'[^']*'\},window\.location\.origin\);\}\);\}''',
              "if(next){next.href='/issue3/?side='+encodeURIComponent(side);if(window.top!==window.self)next.addEventListener('click',event=>{event.preventDefault();window.parent.postMessage({type:'imamverse-open-reader',issue:'issue3'},window.location.origin);});}",
              t2,
              count=1
          )
          p2.write_text(t2, encoding='utf-8')

          # Add Issue Three to the homepage and overlay reader.
          home = Path('index.html')
          th = home.read_text(encoding='utf-8')
          th = th.replace('Read ÏMAM Issue One: Days Before Reincarnation and Issue Two: The Reincarnation online.',
                          'Read ÏMAM Issue One: Days Before Reincarnation, Issue Two: The Reincarnation, and Issue Three: Beyond Reincarnation online.')

          if '<a href="issue3/" data-reader="issue3">Issue Three</a>' not in th:
              th = th.replace('<a href="issue2/" data-reader="issue2">Issue Two</a></nav>',
                              '<a href="issue2/" data-reader="issue2">Issue Two</a><a href="issue3/" data-reader="issue3">Issue Three</a></nav>')

          if 'Issue Three · 60 pages' not in th:
              issue2_card = '<article class="issue-card"><a class="cover-wrap" href="issue2/" data-reader="issue2"><img src="assets/issue2/page-01.webp" alt="ÏMAM Issue Two cover" loading="lazy"></a><div class="issue-meta"><div class="issue-no">Issue Two · 36 pages</div><h3>The Reincarnation</h3><p>ÏMAM rises from Casablanca and the world begins to learn his name.</p><div class="issue-actions"><a class="button primary" href="issue2/" data-reader="issue2">Read online</a><a class="button" href="assets/issue2/IMAM_Issue_Two.pdf" download>PDF</a></div></div></article>'
              issue3_card = '<article class="issue-card"><a class="cover-wrap" href="issue3/" data-reader="issue3"><img src="assets/issue3/page-01.webp" alt="ÏMAM Issue Three cover" loading="lazy"></a><div class="issue-meta"><div class="issue-no">Issue Three · 60 pages</div><h3>Beyond Reincarnation</h3><p>With the world turning against him, ÏMAM must decide what kind of power he will become—and whether peace can survive what comes next.</p><div class="issue-actions"><a class="button primary" href="issue3/" data-reader="issue3">Read online</a><a class="button" href="assets/issue3/IMAM_Beyond_Reincarnation_Issue_3.pdf" download>PDF</a></div></div></article>'
              if issue2_card not in th:
                  raise SystemExit('Could not find Issue Two card in index.html')
              th = th.replace(issue2_card, issue2_card + '\n' + issue3_card)

          if "issue3:{src:'issue3/'" not in th:
              new_reader = '''  const openReader=(issue)=>{
            if(!currentSide)return;
            const readers={
              issue1:{src:'issue1/',title:'ÏMAM · Issue One — Days Before Reincarnation'},
              issue2:{src:'issue2/',title:'ÏMAM · Issue Two — The Reincarnation'},
              issue3:{src:'issue3/',title:'ÏMAM · Issue Three — Beyond Reincarnation'}
            };
            const selected=readers[issue]||readers.issue1;
            frame.src=selected.src+'?side='+encodeURIComponent(currentSide);
            overlayTitle.textContent=selected.title;
            overlay.classList.add('is-open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
          };'''
              reader_pattern = re.compile(r'''  const openReader=\(issue\)=>\{.*?\n  \};(?=\n  document\.querySelectorAll)''', re.S)
              th, count = reader_pattern.subn(new_reader, th, count=1)
              if count != 1:
                  raise SystemExit('Could not update homepage reader function.')

          home.write_text(th, encoding='utf-8')
          print(f'Issue 3 integrated: 60 pages, PDF {size_mb:.1f} MB, reader, homepage and Issue Two link.')
          PY

      - name: Commit Issue 3 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/issue3 issue3.html issue2.html index.html
          if git diff --cached --quiet; then
            echo "Issue 3 is already integrated."
          else
            git commit -m "Add Issue 3 Beyond Reincarnation"
            git push
          fi
