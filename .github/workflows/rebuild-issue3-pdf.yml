name: Rebuild Issue 3 PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-issue3-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tools
        run: python -m pip install --disable-pip-version-check pillow reportlab

      - name: Build 61-page web PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from PIL import Image
          from reportlab.pdfgen import canvas

          cover = Path('assets/issue3/cover.webp')
          pages_dir = Path('assets/IMAM_Beyond_Reincarnation_Issue_3_WebP_Pages')
          sources = [cover] + [pages_dir / f'issue-3-page-{i:02d}.webp' for i in range(1, 61)]
          missing = [str(p) for p in sources if not p.exists()]
          if missing:
              raise SystemExit('Missing source files: ' + ', '.join(missing))

          out = Path('assets/issue3/IMAM_Beyond_Reincarnation_Issue_3.pdf')
          page_w, page_h = 506.0, 737.0

          with TemporaryDirectory() as td:
              td = Path(td)
              jpgs = []
              for idx, src in enumerate(sources, 1):
                  with Image.open(src) as im:
                      im = im.convert('RGB')
                      max_w = 760
                      if im.width > max_w:
                          new_h = round(im.height * max_w / im.width)
                          im = im.resize((max_w, new_h), Image.Resampling.LANCZOS)
                      jpg = td / f'{idx:03d}.jpg'
                      im.save(jpg, 'JPEG', quality=72, optimize=True, subsampling=2)
                      jpgs.append(jpg)

              c = canvas.Canvas(str(out), pagesize=(page_w, page_h), pageCompression=1)
              c.setTitle('IMAM - Beyond Reincarnation - Issue Three')
              c.setAuthor('IMAM')
              c.setSubject('Issue Three - Beyond Reincarnation - 61-page cover edition')
              for jpg in jpgs:
                  c.drawImage(str(jpg), 0, 0, width=page_w, height=page_h, preserveAspectRatio=False)
                  c.showPage()
              c.save()

          size = out.stat().st_size
          print(f'Built {out} ({size / 1024 / 1024:.2f} MiB) with 61 pages')
          if size >= 24 * 1024 * 1024:
              raise SystemExit(f'PDF is too large for Cloudflare Pages: {size} bytes')
          PY

      - name: Commit replacement PDF
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/issue3/IMAM_Beyond_Reincarnation_Issue_3.pdf
          git rm .github/workflows/rebuild-issue3-pdf.yml
          git commit -m "Replace Issue 3 PDF with cover edition"
          git push
