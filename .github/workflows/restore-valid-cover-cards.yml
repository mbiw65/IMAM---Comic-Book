name: Restore valid cover cards

on:
  push:
    paths:
      - '.github/workflows/restore-valid-cover-cards.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore working chapter cover images
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/issue2/cover-saga.webp?v=25', 'assets/issue2/page-01.webp?v=26')
          s = s.replace('assets/issue3/cover-saga.webp?v=25', 'assets/issue3/cover.webp?v=26')
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/restore-valid-cover-cards.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/restore-valid-cover-cards.yml
          git commit -m 'Restore working chapter cover cards'
          git push
