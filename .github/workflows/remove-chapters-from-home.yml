name: Remove chapters from homepage

on:
  push:
    paths:
      - '.github/workflows/remove-chapters-from-home.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove all visible chapter content from the website
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove chapter references from the page metadata.
          s = re.sub(
              r'<meta name="description" content="[^"]*">',
              '<meta name="description" content="ÏMAM — Official Comic.">',
              s,
              count=1,
          )

          # Remove the chapter navigation links while keeping the header/brand intact.
          s = re.sub(
              r'<nav class="nav">.*?</nav>',
              '<nav class="nav"></nav>',
              s,
              count=1,
              flags=re.S,
          )

          # Remove the chapter buttons from the hero only.
          s = re.sub(
              r'<div class="hero-actions">.*?</div>',
              '',
              s,
              count=1,
              flags=re.S,
          )

          # Remove the complete chapter grid/section from the homepage.
          s, n = re.subn(
              r'<section class="section" id="issues">.*?</section>\s*(?=<section class="quote">)',
              '',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Could not find the chapter section to remove')

          p.write_text(s, encoding='utf-8')
          PY

          rm .github/workflows/remove-chapters-from-home.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/remove-chapters-from-home.yml
          git commit -m 'Remove chapters from website'
          git push
