name: Publish centered-dot final chapters
on:
  push:
    paths:
      - '.chapter_uploads/dotfix/IMAM_Website_Update_Payload.zip'
      - 'tools/apply_centered_dots_final.py'
      - '.github/workflows/apply-centered-dots-final.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and PDF tools
        run: python -m pip install --disable-pip-version-check pillow img2pdf
      - name: Apply final chapter corrections
        run: python tools/apply_centered_dots_final.py
      - name: Commit corrected website editions
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/issue1 assets/issue2 assets/issue3 issue1.html issue2.html issue3.html index.html
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish corrected centered-dot trilogy"
          git push
