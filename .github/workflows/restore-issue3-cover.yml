name: Restore Issue 3 cover

on:
  push:
    paths:
      - '.github/workflows/restore-issue3-cover.yml'

permissions:
  contents: write

jobs:
  restore-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Build web cover
        run: |
          python - <<'PY'
          from PIL import Image
          src='assets/issue3/cover-original.png'
          dst='assets/issue3/cover.webp'
          im=Image.open(src).convert('RGB')
          im.save(dst,'WEBP',quality=90,method=6)
          print('saved', dst)
          PY
      - name: Commit cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/issue3/cover.webp
          git diff --cached --quiet && exit 0
          git commit -m "Restore Issue 3 web cover"
          git push
