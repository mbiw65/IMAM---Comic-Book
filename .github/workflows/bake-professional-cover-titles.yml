name: Bake professional cover titles

on:
  push:
    paths:
      - '.github/workflows/bake-professional-cover-titles.yml'

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick fonts-dejavu-core
      - name: Bake saga title into Chapter II and III covers
        shell: bash
        run: |
          set -e
          bake_cover() {
            src="$1"
            out="$2"
            read w h <<< "$(identify -format '%w %h' "$src")"
            x1=$((w * 120 / 1000))
            x2=$((w * 900 / 1000))
            y1=$((h * 148 / 1000))
            y2=$((h * 215 / 1000))
            line1=$((h * 151 / 1000))
            line2=$((h * 211 / 1000))
            texty=$((h * 163 / 1000))
            fs=$((w * 29 / 1000))
            kern=$((w * 2 / 1000))
            convert "$src" \
              -fill 'rgba(5,7,7,0.94)' -stroke none -draw "rectangle ${x1},${y1} ${x2},${y2}" \
              -stroke '#d8d0c4' -strokewidth 1 -draw "line ${x1},${line1} ${x2},${line1}" \
              -draw "line ${x1},${line2} ${x2},${line2}" \
              -stroke none -font /usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf \
              -fill '#f2eee7' -gravity North -pointsize "$fs" -kerning "$kern" \
              -annotate +0+"$texty" 'DAYS BEFORE REINCARNATION' \
              -quality 88 "$out"
          }
          bake_cover assets/issue2/page-01.webp assets/issue2/cover-saga.webp
          bake_cover assets/issue3/cover.webp assets/issue3/cover-saga.webp

          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('assets/issue2/page-01.webp?v=26', 'assets/issue2/cover-saga.webp?v=27')
          s = s.replace('assets/issue3/cover.webp?v=26', 'assets/issue3/cover-saga.webp?v=27')
          p.write_text(s, encoding='utf-8')
          PY

          rm .github/workflows/bake-professional-cover-titles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/issue2/cover-saga.webp assets/issue3/cover-saga.webp .github/workflows/bake-professional-cover-titles.yml
          git commit -m 'Bake Days Before Reincarnation into chapter covers'
          git push
