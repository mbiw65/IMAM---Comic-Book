name: Fix chapter cover mappings

on:
  push:
    paths:
      - '.github/workflows/fix-chapter-covers.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore valid chapter covers and exact page-01 paths
        shell: bash
        run: |
          set -euo pipefail

          # Chapter I already has the known-good cover at page-01.webp.
          # Copy the known-good Chapter II and III cover assets onto the exact page-01 paths.
          cp assets/issue2/cover-saga.webp assets/issue2/page-01.webp
          cp assets/issue3/cover-saga.webp assets/issue3/page-01.webp

          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'assets/issue1/cover-final.webp?v=30': 'assets/issue1/page-01.webp?v=31',
              'assets/issue2/cover-final.webp?v=30': 'assets/issue2/page-01.webp?v=31',
              'assets/issue3/cover-final.webp?v=30': 'assets/issue3/page-01.webp?v=31',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected source: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          rm .github/workflows/fix-chapter-covers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/issue2/page-01.webp assets/issue3/page-01.webp .github/workflows/fix-chapter-covers.yml
          git commit -m 'Fix chapter covers and page-01 mappings'
          git push
