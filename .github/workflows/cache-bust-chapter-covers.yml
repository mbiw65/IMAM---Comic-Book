name: Cache bust chapter cover styles

on:
  push:
    paths:
      - '.github/workflows/cache-bust-chapter-covers.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Force browsers to load latest chapter cover styles
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          for name in ['index.html','issue1.html','issue2.html','issue3.html']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              import re
              text = re.sub(r'styles\.css\?v=\d+', 'styles.css?v=24', text)
              p.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/cache-bust-chapter-covers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html issue1.html issue2.html issue3.html .github/workflows/cache-bust-chapter-covers.yml
          git commit -m 'Bust cache for chapter cover title styles'
          git push
