<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ÏMAM — Days Before Reincarnation</title>
  <link rel="icon" href="/assets/site/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=10">
</head>
<body class="reader-body" data-pages="24">
  <div class="progress" id="progress"></div>
  <header class="reader-bar">
    <div class="left">
      <a class="icon-btn" id="homeLink" href="/">← Home</a>
      <div class="reader-title">Days Before Reincarnation<small>ÏMAM · Issue One</small></div>
    </div>
    <div class="right">
      <button class="icon-btn hide-mobile" id="prevPage">←</button>
      <span class="page-counter" id="pageCounter">1 / 24</span>
      <button class="icon-btn hide-mobile" id="nextPage">→</button>
      <button class="icon-btn" id="fullscreen">⛶</button>
    </div>
  </header>
  <main class="reader-wrap" id="reader"></main>
  <script>
    (() => {
      const params=new URLSearchParams(location.search),requested=params.get('side'),saved=localStorage.getItem('imamverse_side');
      const side=(requested==='mbiw'||requested==='imam')?requested:((saved==='mbiw'||saved==='imam')?saved:'imam');
      document.documentElement.dataset.side=side;document.body.dataset.side=side;
      const reader=document.getElementById('reader');
      for(let i=1;i<=24;i++){
        const n=String(i).padStart(2,'0'),fig=document.createElement('figure'),img=document.createElement('img');
        fig.className='comic-page';fig.id=`page-${i}`;fig.dataset.page=i;fig.dataset.label=`Page ${i}`;
        img.src=`/assets/issue1/page-${n}.webp`;img.alt=`ÏMAM Issue One — Page ${i}`;img.loading=i<=2?'eager':'lazy';img.decoding='async';
        fig.appendChild(img);reader.appendChild(fig);
      }
      reader.insertAdjacentHTML('beforeend',`<section class="reader-end"><div class="eyebrow">End of Issue One</div><h2>The Reincarnation Begins.</h2><p>Continue directly into Issue Two.</p><div class="hero-actions"><a class="button primary" id="nextIssue" href="/issue2/">Read Issue Two</a><a class="button" href="/assets/issue1/IMAM_Issue_One.pdf" download>Download PDF</a></div></section>`);
      const closeFromFrame=(event)=>{if(window.top!==window.self){event.preventDefault();window.parent.postMessage({type:'imamverse-close-reader'},window.location.origin);}};
      const home=document.getElementById('homeLink');if(home)home.addEventListener('click',closeFromFrame);
      const back=document.getElementById('backHome');if(back)back.addEventListener('click',closeFromFrame);
      const next=document.getElementById('nextIssue');
      if(next){next.href='/issue2/?side='+encodeURIComponent(side);if(window.top!==window.self)next.addEventListener('click',event=>{event.preventDefault();window.parent.postMessage({type:'imamverse-open-reader',issue:'issue2'},window.location.origin);});}
    })();
  </script>
  <script src="/reader.js?v=10"></script>
</body>
</html>
