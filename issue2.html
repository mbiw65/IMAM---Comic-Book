<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ÏMAM — The Reincarnation</title>
  <link rel="icon" href="/assets/site/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=9">
</head>
<body class="reader-body" data-pages="36">
  <div class="progress" id="progress"></div>
  <header class="reader-bar">
    <div class="left">
      <a class="icon-btn" id="homeLink" href="/">← Home</a>
      <div class="reader-title">The Reincarnation<small>ÏMAM · Issue Two</small></div>
    </div>
    <div class="right">
      <button class="icon-btn hide-mobile" id="prevPage">←</button>
      <span class="page-counter" id="pageCounter">1 / 36</span>
      <button class="icon-btn hide-mobile" id="nextPage">→</button>
      <button class="icon-btn" id="fullscreen">⛶</button>
    </div>
  </header>
  <main class="reader-wrap" id="reader"></main>
  <script>
    (() => {
      const reader = document.getElementById('reader');
      for (let i = 1; i <= 36; i++) {
        const n = String(i).padStart(2, '0');
        const fig = document.createElement('figure');
        fig.className = 'comic-page';
        fig.id = `page-${i}`;
        fig.dataset.page = i;
        fig.dataset.label = `Page ${i}`;
        const img = document.createElement('img');
        img.src = `/assets/issue2/page-${n}.webp`;
        img.alt = `ÏMAM Issue Two — Page ${i}`;
        img.loading = i <= 2 ? 'eager' : 'lazy';
        img.decoding = 'async';
        fig.appendChild(img);
        reader.appendChild(fig);
      }
      reader.insertAdjacentHTML('beforeend', `
        <section class="reader-end">
          <div class="eyebrow">End of Issue Two</div>
          <h2>The World Is Next.</h2>
          <p>ÏMAM — The Reincarnation.</p>
          <div class="hero-actions">
            <a class="button primary" id="backHome" href="/">Back Home</a>
            <a class="button" href="/assets/issue2/IMAM_Issue_Two.pdf" download>Download PDF</a>
          </div>
        </section>
      `);
      const closeFromFrame = (event) => {
        if (window.top !== window.self) {
          event.preventDefault();
          window.parent.postMessage({type:'imamverse-close-reader'}, window.location.origin);
        }
      };
      const home = document.getElementById('homeLink');
      const back = document.getElementById('backHome');
      if (home) home.addEventListener('click', closeFromFrame);
      if (back) back.addEventListener('click', closeFromFrame);
    })();
  </script>
  <script src="/reader.js?v=9"></script>
</body>
</html>
