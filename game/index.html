</style></head><body><div id="app"><canvas id="game"></canvas><div class="hud"><div class="id" id="idWrap"><div class="crest"></div><div><div class="name" id="idName">MBIW</div><div class="sub">ÏMAMVERSE · DEMO V2</div></div></div><div class="bars"><div class="barrow"><span>Life</span><div class="bar"><div class="fill" id="hp"></div></div></div><div class="barrow"><span>Reincarnation</span><div class="bar"><div class="fill rage" id="rage"></div></div></div></div></div><div class="chapter" id="chapter"></div><div class="objective"><b>Objective</b><div id="objective">Survive the rooftop ambush.</div></div><div class="transform" id="transform"><img src="assets/transform.webp" alt=""><strong>ÏMAM</strong></div><div class="status" id="status"><h2 id="statusTitle"></h2><p id="statusText"></p><button class="btn" id="restart">Restart Demo</button></div><div class="hint">A/D or ←/→ Move · Space Jump · J Attack · Shift Dash</div><div class="mobile"><div class="cluster"><button class="touch" data-k="left">◀</button><button class="touch" data-k="right">▶</button></div><div class="cluster"><button class="touch" data-k="dash">↠</button><button class="touch" data-k="jump">↑</button><button class="touch attack" data-k="attack">✦</button></div></div><div class="start" id="start"><div class="card"><h1>ÏMAMVERSE</h1><p>Latest playable visual build: MBIW on the Casablanca rooftops, reincarnation into ÏMAM, then the Corrupted Warden encounter.</p><button class="btn" id="play">Start Demo V2</button></div></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),hp=document.getElementById('hp'),rage=document.getElementById('rage'),idName=document.getElementById('idName'),idWrap=document.getElementById('idWrap'),chapter=document.getElementById('chapter'),objective=document.getElementById('objective'),tr=document.getElementById('transform'),status=document.getElementById('status'),st=document.getElementById('statusTitle'),ss=document.getElementById('statusText');let W=innerWidth,H=innerHeight,D=1,last=0,started=false,phase=0,transforming=false,dead=false,won=false,t=0,shake=0;const keys={left:false,right:false,jump:false},A={},src={mbiw:'assets/mbiw.webp',imam:'assets/imam.webp',enemy:'assets/enemy.webp',boss:'assets/boss.webp',bg:'assets/casablanca.webp'};const demise=new Audio('../assets/audio/3%20-%20DEMISE%20OF%20MBIW.mp3'),taliban=new Audio('../assets/audio/5%20-%20Taliban.mp3');demise.loop=taliban.loop=true;demise.volume=.1;taliban.volume=.11;const load=()=>Promise.allSettled(Object.entries(src).map(([k,u])=>new Promise(r=>{const i=new Image;i.onload=()=>{A[k]=i;r(true)};i.onerror=()=>r(false);i.src=u})));function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();const ground=()=>H*.81,p={x:110,y:0,w:44,h:92,vx:0,vy:0,on:true,face:1,hp:100,rage:0,imam:false,atk:0,inv:0,dash:0,cd:0,anim:0};let enemies=[],parts=[],slashes=[];function say(a,b,d=2200){chapter.innerHTML='<h1>'+a+'</h1><p>'+b+'</p>';clearTimeout(say.t);say.t=setTimeout(()=>chapter.innerHTML='',d)}function enemy(x){return{x,y:ground()-72,w:38,h:72,hp:4,max:4,hit:0,vx:0,type:'street',anim:Math.random()*2,face:-1}}function wave(){enemies=[enemy(W*.54),enemy(W*.7),enemy(W*.84)]}function reset(){p.x=Math.max(70,W*.09);p.y=ground()-p.h;p.vx=p.vy=0;p.hp=100;p.rage=0;p.imam=false;p.atk=p.inv=p.dash=p.cd=0;p.anim=0;phase=0;transforming=dead=won=false;enemies=[];parts=[];slashes=[];idName. ild uses the latest character and Casablanca visual direction.';status.classList.add('show');say('VICTORY','THE REINCARNATION HAS BEGUN',999999)}function update(dt){if(!started||transforming||dead||won)return;t+=dt;p.inv=Math.max(0,p.inv-dt);p.atk=Math.max(0,p.atk-dt);p.dash=Math.max(0,p.dash-dt);p.cd=Math.max(0,p.cd-dt);p.anim+=dt;const d=(keys.right?1:0)-(keys.left?1:0);if(d)p.face=d;if(p.dash<=0)p.vx=d*(p.imam?350:315);if(keys.jump&&p.on){p.vy=-(p.imam?690:p.jump);p.on=false;keys.jump=false}p.vy+=1750*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(18,Math.min(W-p.w-18,p.x));if(p.y+p.h>=ground()){p.y=ground()-p.h;p.vy=0;p.on=true}const ab={x:p.face>0?p.x+p.w-3:p.x-(p.imam?88:70),y:p.y+8,w:p.imam?92:74,h:p.h-12};for(const e of enemies){e.anim+=dt;e.hit=Math.max(0,e.hit-dt);const dx=(p.x+p.w/2)-(e.x+e.w/2),dist=Math.abs(dx);e.face=dx>=0?1:-1;e.vx=dist>56?Math.sign(dx)*(e.type==='boss'?62:78):0;e.x+=e.vx*dt;if(p.atk>0&&hit(ab,e)&&e.hit<=0){e.hp-=p.imam?(e.type==='boss'?2:3):1;e.hit=.24;e.x+=p.face*(p.imam?38:24);spark(e.x+e.w/2,e.y+e.h*.45,p.imam?13:7,p.imam);slash(e.x+e.w/2,e.y+e.h*.45,p.face,p.imam,p.imam);p.rage=Math.min(100,p.rage+(p.imam?0:12));shake=Math.max(shake,p.imam?8:4)}if(hit(p,e)&&p.inv<=0){p.hp-=e.type==='boss'?19:(p.imam?8:13);p.inv=.65;p.vy=-230;p.x+=Math.sign(dx)*-34;spark(p.x+p.w/2,p.y+40,8,p.imam);if(!p.imam)p.rage=Math.min(100,p.rage+13);shake=9}}enemies=enemies.filter(e=>e.hp>0);if(phase===0&&enemies.length===0){p.rage=100;transform()}if(phase===1&&p.imam&&enemies.length===0)win();if(p.hp<=0)lose();hp.style.width=Math.max(0,p.hp)+'%';rage.style.width=p.rage+'%';for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=540*dt;q.l-=dt}parts=parts.filter(q=>q.l>0);slashes.forEach(s=>s.l-=dt);slashes=slashes.filter(s=>s.l>0);shake*=.84}function bg(){const i=A.bg;if(i){const ar=i.width/i.height,tar=W/H;let sw=i.width,sh=i.height,sx=0,sy=0;if(ar>tar){sw=i.height*tar;sx=(i.width-sw)/2}else{sh=i.width/tar;sy=(i.height-sh)/2}g.drawImage(i,sx,sy,sw,sh,0,0,W,H)}const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#00020a12');gr.addColorStop(.7,'#00000022');gr.addColorStop(1,'#000000c7');g.fillStyle=gr;g.fillRect(0,0,W,H);if(p.imam){g.fillStyle='#1a6e3115';g.fillRect(0,0,W,H)}g.fillStyle='#071014bb';g.fillRect(0,ground(),W,H-ground());g.globalAlpha=.45;g.fillStyle=p.imam?'#42da6c':'#9ed8ff';g.fillRect(0,ground()-1,W,2);g.globalAlpha=1}function strip(img,f,cw,ch,dx,dy,dw,dh,face=1){g.save();if(face<0){g.translate(dx+dw,0);g.scale(-1,1);dx=0}if(img&&img.complete&&img.naturalWidth){g.drawImage(img,f*cw,0,cw,ch,dx,dy,dw,dh)}else{g.fillStyle=p.imam?'#173b24':'#d9e7ee';g.fillRect(dx+dw*.28,dy+dh*.18,dw*.44,dh*.68);g.fillStyle=p.imam?'#77f092':'#1a2630';g.beginPath();g.arc(dx+dw*.5,dy+dh*.16,dw*.16,0,Math.PI*2);g.fill()}g.restore()}function drawP(){const img=p.imam?A.imam:A.mbiw,f=Math.abs(p.vx)>10&&p.on?2+(Math.floor(p.anim*10)%4):(Math.floor(p.anim*4)%2),dw=p.imam?142:134,dh=181,dx=p.x+p.w/2-dw/2,dy=p.y+p.h-dh+10;g.save();if(p.inv>0&&Math.floor(t*18)%2===0)g.globalAlpha=.45;strip(img,f,70,95,dx,dy,dw,dh,p.face);g.restore();if(p.atk>0){g.save();g.strokeStyle=p.imam?'#68f58b':'#bce9ff';g.lineWidth=p.imam?10:7;g.shadowColor=g.strokeStyle;g.shadowBlur=20;g.beginPath();const cx=p.x+p.w/2,cy=p.y+40,r=p.imam?67:53;if(p.face>0)g.arc(cx+20,cy,r,-1.1,1.05);else g.arc(cx-20,cy,r,Math.PI-1.05,Math.PI+1.1);g.stroke();g.restore()}}function drawE(e){if(e.type==='boss'){const dw=118,dh=165;g.save();if(e.hit>0){g.shadowColor='#85ff9f';g.shadowBlur=20}if(A.boss&&A.boss.complete&&A.boss.naturalWidth)g.drawImage(A.boss,e.x+e.w/2-dw/2,e.y+e.h-dh+5,dw,dh);else{g.fillStyle='#183321';g.fillRect(e.x,e.y,e.w,e.h)};g.restore();const bw=150,bx=e.x+e.w/2-bw/2,by=e.y-17;g.fillStyle='#16080a';g.fillRect(bx,by,bw,8);g.fillStyle='#d74452';g.fillRect(bx,by,bw*(e.hp/e.max),8);return}const f=Math.floor(e.anim*5)%4,dw=86,dh=119;strip(A.enemy,f,52,72,e.x+e.w/2-dw/2,e.y+e.h-dh+4,dw,dh,e.face)}function fx(){for(const s of slashes){g.save();g.globalAlpha=Math.min(1,s.l/.09);g.strokeStyle=s.green?'#67f28a':'#c8edff';g.lineWidth=s.big?12:7;g.shadowColor=g.strokeStyle;g.shadowBlur=18;g.beginPath();g.arc(s.x,s.y,s.big?64:42,s.face>0?-1.25:Math.PI-1.05,s.face>0?1.1:Math.PI+1.25);g.stroke();g.restore()}for(const q of parts){g.globalAlpha=Math.max(0,q.l);g.fillStyle=q.green?'#7dff99':'#d0efff';g.fillRect(q.x,q.y,q.r,q.r)}g.globalAlpha=1}function render(){g.save();if(shake>1)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);bg();enemies.forEach(drawE);drawP();fx();g.restore();requestAnimationFrame(loop)}function loop(n){const dt=Math.min(.033,(n-last)/1000||0);last=n;update(dt);render()}addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))keys.left=true;if(['arrowright','d'].includes(k))keys.right=true;if(['arrowup','w',' '].includes(k)){keys.jump=true;e.preventDefault()}if(['j','k','x'].includes(k))attack();if(['shift','l'].includes(k))dash();if(k==='r'&&(dead||won)){reset();demise.currentTime=0;demise.play().catch(()=>{})}});addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))keys.left=false;if(['arrowright','d'].includes(k))keys.right=false;if(['arrowup','w',' '].includes(k))keys.jump=false});document.querySelectorAll('.touch').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();if(k==='attack')attack();else if(k==='dash')dash();else keys[k]=true},off=e=>{e.preventDefault();if(k!=='attack'&&k!=='dash')keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off)});let assetsStarted=false;document.getElementById('play').onclick=()=>{if(!assetsStarted){assetsStarted=true;load()}document.getElementById('start').style.display='none';started=true;reset();demise.currentTime=0;demise.play().catch(()=>{})};document.getElementById('restart').onclick=()=>{reset();demise.currentTime=0;demise.play().catch(()=>{})};load().then(()=>{assetsStarted=true});requestAnimationFrame(loop)})();
